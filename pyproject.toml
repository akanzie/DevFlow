[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyclip"
version = "1.0.0"
description = "Windows-first local clipboard and note capture tool."
readme = "DailyClip/README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "duckdb>=0.9.0",
    "keyboard>=0.13.5",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "dependency-injector>=4.41.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
]

[tool.setuptools.packages.find]
include = ["DailyClip", "DailyClip.*"]
exclude = ["DailyClip.tests", "DailyClip.tests.*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["DailyClip"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["DailyClip/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
namespace_packages = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
